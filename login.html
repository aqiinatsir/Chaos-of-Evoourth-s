<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chaos of Evoourth's</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0e27 0%, rgba(124, 58, 237, 0.1) 100%);
            padding: 20px;
        }

        .auth-form {
            background-color: var(--secondary-dark);
            border: 2px solid var(--accent-silver);
            border-radius: 10px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(192, 192, 192, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo {
            height: 100px;
            width: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(192, 192, 192, 0.3));
        }

        .auth-header h1 {
            color: var(--accent-silver);
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(192, 192, 192, 0.3);
        }

        .auth-header p {
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--accent-silver);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-dark);
            border: 1px solid var(--accent-gray);
            border-radius: 5px;
            color: var(--text-light);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-silver);
            box-shadow: 0 0 10px rgba(192, 192, 192, 0.2);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-submit:hover {
            background-color: #6d28d9;
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.5);
            transform: translateY(-2px);
        }

        .toggle-form {
            text-align: center;
            color: var(--text-muted);
        }

        .toggle-form a {
            color: var(--accent-silver);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .toggle-form a:hover {
            color: var(--primary-color);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #86efac;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-silver);
            text-shadow: 0 0 10px rgba(192, 192, 192, 0.5);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <nav class="navbar">
            <div class="logo-container">
                <img src="server.png" alt="Server Logo" class="logo-img" style="height: 40px; width: auto;">
                <span class="logo-text">Chaos of Evoourth's</span>
            </div>
        </nav>
    </header>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-form">
            <!-- Login Form -->
            <div class="form-section active" id="loginForm">
                <div class="auth-header">
                    <h1>Login</h1>
                    <p>Masuk ke akun Anda</p>
                </div>

                <div class="error-message" id="loginError"></div>
                <div class="success-message" id="loginSuccess"></div>

                <form id="loginFormElement" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" placeholder="Masukkan email Anda" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="Masukkan password Anda" required>
                    </div>
                    <button type="submit" class="btn-submit">Login</button>
                </form>

                <div class="toggle-form">
                    Belum punya akun? <a onclick="toggleForm()">Daftar di sini</a>
                </div>
            </div>

            <!-- Register Form -->
            <div class="form-section" id="registerForm">
                <div class="auth-header">
                    <h1>Register</h1>
                    <p>Buat akun baru</p>
                </div>

                <div class="error-message" id="registerError"></div>
                <div class="success-message" id="registerSuccess"></div>

                <form id="registerFormElement" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="registerUsername" placeholder="Pilih username Anda" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="registerEmail" placeholder="Masukkan email Anda" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="registerPassword" placeholder="Buat password kuat" required>
                    </div>
                    <div class="form-group">
                        <label>Konfirmasi Password</label>
                        <input type="password" id="registerConfirmPassword" placeholder="Konfirmasi password Anda" required>
                    </div>
                    <button type="submit" class="btn-submit">Register</button>
                </form>

                <div class="toggle-form">
                    Sudah punya akun? <a onclick="toggleForm()">Login di sini</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleForm() {
            document.getElementById('loginForm').classList.toggle('active');
            document.getElementById('registerForm').classList.toggle('active');
            document.getElementById('loginError').classList.remove('show');
            document.getElementById('registerError').classList.remove('show');
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const users = JSON.parse(localStorage.getItem('users')) || [];
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                window.location.href = 'index.html';
            } else {
                showError('loginError', 'Email atau password salah!');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;

            if (password !== confirmPassword) {
                showError('registerError', 'Password tidak cocok!');
                return;
            }

            const users = JSON.parse(localStorage.getItem('users')) || [];
            if (users.find(u => u.email === email)) {
                showError('registerError', 'Email sudah terdaftar!');
                return;
            }

            const newUser = {
                id: Date.now(),
                username: username,
                email: email,
                password: password,
                avatar: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23c0c0c0" width="100" height="100"/><text x="50" y="60" font-size="50" text-anchor="middle" fill="%230a0e27">👤</text></svg>',
                createdAt: new Date().toISOString()
            };

            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));

            showSuccess('registerSuccess', 'Akun berhasil dibuat! Silakan login.');
            setTimeout(() => {
                toggleForm();
            }, 1500);
        }

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.classList.add('show');
        }

        function showSuccess(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.classList.add('show');
        }
    </script>
</body>
</html>
